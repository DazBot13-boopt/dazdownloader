name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore debug keystore (same cert as user's phone)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing — APK would be signed with a random cert that cannot upgrade installed versions."
            exit 1
          fi
          # Nuke any keystore the Android SDK may have auto-generated before
          # this step runs, both at the shell's $HOME and at the one Gradle's
          # JVM resolves — our restored file must be the only one found.
          rm -f "$HOME/.android/debug.keystore" "/root/.android/debug.keystore" 2>/dev/null || true
          mkdir -p "$HOME/.android"
          # -i tolerates line breaks / whitespace in the pasted secret.
          # printf '%s' avoids the extra trailing newline echo would add.
          if printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d -i > "$HOME/.android/debug.keystore" 2>/dev/null \
             && [ -s "$HOME/.android/debug.keystore" ]; then
            SIZE=$(stat -c%s "$HOME/.android/debug.keystore")
            echo "Debug keystore restored at $HOME/.android/debug.keystore (${SIZE} bytes)."
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::Decoded keystore is suspiciously small (${SIZE} bytes)."
              exit 1
            fi
            # Print the SHA-256 fingerprint of the restored keystore for
            # cross-check with the APK's signature after the build.
            keytool -list -keystore "$HOME/.android/debug.keystore" \
                    -storepass android -alias androiddebugkey 2>&1 \
              | grep -E "SHA256|SHA-256" || true
          else
            echo "::error::Failed to decode DEBUG_KEYSTORE_BASE64. Re-upload with: base64 -w 0 ~/.android/debug.keystore | gh secret set DEBUG_KEYSTORE_BASE64 -R <repo>"
            exit 1
          fi

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing — the Firebase Gradle plugin needs android/app/google-services.json at build time."
            exit 1
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d -i > android/app/google-services.json 2>/dev/null \
             && [ -s android/app/google-services.json ] \
             && jq -e '.project_info.project_id' android/app/google-services.json >/dev/null 2>&1; then
            echo "Firebase config restored ($(stat -c%s android/app/google-services.json) bytes)."
          else
            echo "::error::Failed to decode or validate GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build slim arm64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Rename artifact with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/loady-${VERSION}-arm64.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/loady-${VERSION}-arm64.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Verify APK signature matches the restored keystore
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.rename.outputs.apk_path }}" \
            | grep -E "certificate SHA-256|certificate DN" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loady-apk-${{ steps.rename.outputs.version }}
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error

      - name: Attach APK to release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
