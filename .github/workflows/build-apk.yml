name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore debug keystore (same cert as user's phone)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is missing — build will use the runner's auto-generated debug keystore (signature will not match previously-installed APKs)."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          # -i / --ignore-garbage tolerates line breaks, stray whitespace or
          # extra characters that may have slipped in during copy-paste.
          # printf '%s' avoids the trailing newline that `echo` would add.
          if printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d -i > "$HOME/.android/debug.keystore" 2>/dev/null \
             && [ -s "$HOME/.android/debug.keystore" ]; then
            SIZE=$(stat -c%s "$HOME/.android/debug.keystore")
            echo "Debug keystore restored (${SIZE} bytes)."
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::Decoded keystore is suspiciously small (${SIZE} bytes). Re-encode with: base64 -w 0 ~/.android/debug.keystore"
              exit 1
            fi
          else
            echo "::error::Failed to decode DEBUG_KEYSTORE_BASE64. Re-generate with: base64 -w 0 ~/.android/debug.keystore"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename artifact with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/loady-${VERSION}-arm64.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/loady-${VERSION}-arm64.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loady-apk-${{ steps.rename.outputs.version }}
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error

      - name: Attach APK to release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
