name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore debug keystore (same cert as user's phone)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing — APK would be signed with a random cert that cannot upgrade installed versions."
            exit 1
          fi
          # Nuke any keystore the Android SDK may have auto-generated before
          # this step runs, both at the shell's $HOME and at the one Gradle's
          # JVM resolves — our restored file must be the only one found.
          rm -f "$HOME/.android/debug.keystore" "/root/.android/debug.keystore" 2>/dev/null || true
          mkdir -p "$HOME/.android"
          # -i tolerates line breaks / whitespace in the pasted secret.
          # printf '%s' avoids the extra trailing newline echo would add.
          if printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d -i > "$HOME/.android/debug.keystore" 2>/dev/null \
             && [ -s "$HOME/.android/debug.keystore" ]; then
            SIZE=$(stat -c%s "$HOME/.android/debug.keystore")
            echo "Debug keystore restored at $HOME/.android/debug.keystore (${SIZE} bytes)."
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::Decoded keystore is suspiciously small (${SIZE} bytes)."
              exit 1
            fi
            # Print the SHA-256 fingerprint of the restored keystore for
            # cross-check with the APK's signature after the build.
            keytool -list -keystore "$HOME/.android/debug.keystore" \
                    -storepass android -alias androiddebugkey 2>&1 \
              | grep -E "SHA256|SHA-256" || true
          else
            echo "::error::Failed to decode DEBUG_KEYSTORE_BASE64. Re-upload with: base64 -w 0 ~/.android/debug.keystore | gh secret set DEBUG_KEYSTORE_BASE64 -R <repo>"
            exit 1
          fi

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing — the Firebase Gradle plugin needs android/app/google-services.json at build time."
            exit 1
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d -i > android/app/google-services.json 2>/dev/null \
             && [ -s android/app/google-services.json ] \
             && jq -e '.project_info.project_id' android/app/google-services.json >/dev/null 2>&1; then
            echo "Firebase config restored ($(stat -c%s android/app/google-services.json) bytes)."
          else
            echo "::error::Failed to decode or validate GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

      # A release tag must name the version it ships, otherwise the site and
      # the in-app update check would announce the wrong number.
      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          NAME=${VERSION%%+*}
          if [ "${GITHUB_REF_NAME}" != "v${NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${VERSION} (expected v${NAME})."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # arm64 for recent phones, armeabi-v7a for 32-bit ones.
      - name: Build release APKs (arm64 + armeabi-v7a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Rename artifacts with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          NAME=${VERSION%%+*}
          BUILD=${VERSION##*+}
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist release
          cp "$OUT/app-arm64-v8a-release.apk" "dist/loady-${VERSION}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/loady-${VERSION}-armv7.apk"
          # Stable names for the release: the site links to
          # releases/latest/download/app-arm64-v8a-release.apk.
          cp "$OUT/app-arm64-v8a-release.apk" "$OUT/app-armeabi-v7a-release.apk" release/
          printf '{"version":"%s","build":%s}\n' "$NAME" "$BUILD" > release/version.json
          (cd release && sha256sum app-*.apk > SHA256SUMS.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/loady-${VERSION}-arm64.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/ release/

      - name: Verify APK signature matches the restored keystore
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "$apk"
            "$APKSIGNER" verify --print-certs "$apk" \
              | grep -E "certificate SHA-256|certificate DN" || true
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loady-apk-${{ steps.rename.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      # An official (not pre-release) release becomes "latest", which is what
      # the site's download button and the in-app update check read.
      - name: Publish release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/app-arm64-v8a-release.apk
            release/app-armeabi-v7a-release.apk
            release/SHA256SUMS.txt
            release/version.json
          prerelease: false
          make_latest: true
          generate_release_notes: true
