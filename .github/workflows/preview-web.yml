name: Build web preview

on:
  push:
    branches: [design]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web preview
        run: flutter build web --release --base-href /
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: loady-design-preview
          path: build/web
          retention-days: 3
