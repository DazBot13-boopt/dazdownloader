name: Build Release AAB (Play Store)

# Produces an Android App Bundle (.aab) signed with the upload key enrolled
# in Google Play App Signing. Debug APK builds live in build-apk.yml.
#
# Required repo secrets:
#   UPLOAD_KEYSTORE_BASE64   base64 of android/upload-keystore.jks
#   UPLOAD_STORE_PASSWORD    keystore password
#   UPLOAD_KEY_ALIAS         key alias inside the keystore (e.g. "upload")
#   UPLOAD_KEY_PASSWORD      key password (often same as store password)
#   GOOGLE_SERVICES_JSON_BASE64   base64 of android/app/google-services.json

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: write

concurrency:
  group: aab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for v in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is missing — release AAB cannot be signed with the Play upload key."
              exit 1
            fi
          done
          # -i tolerates line breaks / whitespace, printf '%s' avoids echo's trailing newline.
          if printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d -i > android/upload-keystore.jks 2>/dev/null \
             && [ -s android/upload-keystore.jks ]; then
            SIZE=$(stat -c%s android/upload-keystore.jks)
            echo "Upload keystore restored (${SIZE} bytes)."
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::Decoded keystore is suspiciously small (${SIZE} bytes)."
              exit 1
            fi
          else
            echo "::error::Failed to decode UPLOAD_KEYSTORE_BASE64."
            exit 1
          fi

          # key.properties sits in android/ so build.gradle.kts's
          # rootProject.file("key.properties") finds it. storeFile is resolved
          # relative to android/app/ (the module dir), hence ../upload-keystore.jks.
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_STORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          echo "key.properties written."
          # Fingerprint printed so you can cross-check it with what Play
          # Console shows under "App signing" → "Upload certificate".
          keytool -list -v -keystore android/upload-keystore.jks \
                  -storepass "$UPLOAD_STORE_PASSWORD" \
                  -alias "$UPLOAD_KEY_ALIAS" 2>&1 \
            | grep -E "SHA256|SHA-256" || true

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing — the Firebase Gradle plugin needs android/app/google-services.json at build time."
            exit 1
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d -i > android/app/google-services.json 2>/dev/null \
             && [ -s android/app/google-services.json ] \
             && jq -e '.project_info.project_id' android/app/google-services.json >/dev/null 2>&1; then
            echo "Firebase config restored ($(stat -c%s android/app/google-services.json) bytes)."
          else
            echo "::error::Failed to decode or validate GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Rename artifact with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/loady-${VERSION}.aab"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "aab_path=dist/loady-${VERSION}.aab" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: loady-aab-${{ steps.rename.outputs.version }}
          path: ${{ steps.rename.outputs.aab_path }}
          if-no-files-found: error

      - name: Attach AAB to release (only on release-v* tag)
        if: startsWith(github.ref, 'refs/tags/release-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.aab_path }}
          generate_release_notes: true

      - name: Scrub secrets from runner
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties
