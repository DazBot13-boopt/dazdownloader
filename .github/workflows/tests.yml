name: Tests

# Runs the existing checks on every pull request so a change that breaks the
# analyzer or a test is visible before merge. Builds stay in build-apk.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  android-unit:
    name: Android unit tests (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      # The Firebase Gradle plugin refuses to configure the app without it.
      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing — the Firebase Gradle plugin needs android/app/google-services.json."
            exit 1
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d -i > android/app/google-services.json 2>/dev/null \
             && [ -s android/app/google-services.json ] \
             && jq -e '.project_info.project_id' android/app/google-services.json >/dev/null 2>&1; then
            echo "Firebase config restored."
          else
            echo "::error::Failed to decode or validate GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # Writes local.properties and the Gradle wrapper (not committed) without
      # compiling the app.
      - name: Generate Android Gradle configuration
        run: flutter build apk --config-only

      - name: Kotlin unit tests
        working-directory: android
        run: |
          if [ ! -x ./gradlew ]; then
            echo "::error::android/gradlew was not generated by flutter build apk --config-only."
            exit 1
          fi
          ./gradlew :app:testDebugUnitTest --no-daemon
